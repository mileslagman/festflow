<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b1d2a" />
  <title>FestFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&text=FestFlow&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <nav class="nav">
      <a class="brand" href="#/">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M32 4 L38 26 L60 32 L38 38 L32 60 L26 38 L4 32 L26 26 Z" /></svg>
        <span class="brand-name">FestFlow</span>
      </a>
      <a href="#/" data-route="dashboard"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span></a>
      <a href="#/festivals" data-route="festivals"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg><span>Festivals</span></a>
      <a href="#/flights" data-route="flights"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 21 3l-5.5 18-3.8-7.2z"/><path d="M11.7 13.8 21 3"/></svg><span>Flights</span></a>
      <a href="#/calendar" data-route="calendar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></a>
      <a href="#/profile" data-route="profile"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg><span>Profile</span></a>
    </nav>
    <main id="view" class="view"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/flights.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
